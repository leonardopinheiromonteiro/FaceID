services:
  postgres:
    image: postgres:16-alpine
    container_name: faceid_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faceid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faceid_pass_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-faceid_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-faceid_user} -d ${POSTGRES_DB:-faceid_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: faceid_app
    restart: always
    ports:
      - "${PORT:-3000}:3000"
      - "${HTTPS_PORT:-3443}:3443"
    environment:
      NODE_ENV: production
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-faceid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faceid_pass_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-faceid_db}
      PORT: 3000
      HTTPS_PORT: 3443
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.55}
      LOG_REPLACEMENT_INTERVAL_MINUTES: ${LOG_REPLACEMENT_INTERVAL_MINUTES:-5}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
